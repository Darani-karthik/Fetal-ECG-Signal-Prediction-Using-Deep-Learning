[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fecg"
version = "1.0.0"
description = "Fetal ECG extraction from abdominal recordings: CWT scalograms + U-Net image-to-image translation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "PyWavelets>=1.4",
    "torch>=2.0",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
